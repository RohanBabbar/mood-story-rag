# Lint and test on every push and pull request.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes an in-progress run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same Python version as the Hugging Face Space.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # pip (not uv) because that's what the Space installs with.
      - name: Install locked dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
